# CatStudy 技能路由清单
# 定义 catStudy 自定义技能的分类、触发条件、输出和衔接关系
#
# 来源标记（source，三方一致校验强制）：
#   self       — 猫咖自研（本项目维护）
#   mattpocock — 来自 mattpocock/skills 系（特征：disable-model-invocation 字段）
#   external   — 其他第三方来源（无版本溯源，需登记 provenance）
# 判定口径说明：disable-model-invocation 是 mattpocock 技能集的标志性 frontmatter；
# 无该字段的第三方技能统一标 external（来源待核，列入 .sync-provenance.json 追踪）。

skills:
  # ── 自研（猫咖定制，参与审查流程链）──
  quality-gate:
    source: self
    category: '审查流程'
    description: |
      代码变更提交审查前的自查门。
      检查编码规范、测试覆盖、架构边界、安全性和未完成项。
    triggers:
      - '自查'
      - 'quality gate'
      - '提交前检查'
      - '检查一下代码'
    not_for:
      - '纯对话无代码变更'
      - '已在审查循环中'
    output: 'Quality Gate Report（通过/未通过 + 逐项结果）'
    next: 'request-review'
    refs:
      - 'CODING_STANDARDS.md'
      - 'refs/review-standards.md'

  request-review:
    source: self
    category: '审查流程'
    description: |
      打包完成的工作并发送审查请求。
      按照审查配对规则选择审查者，使用标准模板格式。
    triggers:
      - '发起审查'
      - 'request review'
      - '让人看看'
      - 'review 一下'
    not_for:
      - 'quality-gate 未通过'
      - '无代码变更'
      - '自己审查自己'
    output: '审查请求文档（按模板格式 + @审查者）'
    next: 'receive-review'
    refs:
      - 'refs/review-request-template.md'
      - 'refs/shared-rules.md'
    preconditions:
      - 'quality-gate PASS'
      - 'pnpm test 全过'
      - 'pnpm lint 无新增错误'

  receive-review:
    source: self
    category: '审查流程'
    description: |
      接收并处理审查反馈。
      逐项核实审查发现，按 P1/P2/P3 分类处理，拒绝表演性同意。
    triggers:
      - '处理审查'
      - 'receive review'
      - '审查反馈'
      - '@审查者 的审查结果'
    not_for:
      - '审查结论是 ✅ 可以合并'
      - '自己是审查者'
    output: '修复确认表（逐项状态 + 测试结果）'
    next: 'request-review (如需重新审查)'
    refs:
      - 'refs/review-standards.md'
      - 'refs/shared-rules.md'

  session-summary:
    source: mattpocock
    category: '文档'
    description: |
      已有技能（来自 mattpocock/skills）。
      生成 CatStudy 格式的结构化会议总结。
    triggers:
      - '总结'
      - 'session summary'
      - '会议总结'
    output: 'docs/sessions/cat-study-{slug}-summary.md'

  vision-assist:
    source: self
    category: '视觉'
    requires_mcp: 'ollama:qwen3.5:9b (127.0.0.1:11434)'
    description: |
      自研技能：用项目 qwen3.5:9b（Ollama）视觉管线当眼睛。
      模型无法原生看图时路由到本技能。
    triggers:
      - '看图'
      - 'vision'
      - '截图'
    output: '图片内容描述'

  # ── mattpocock 系（disable-model-invocation 特征）──
  ask-matt:
    source: mattpocock
    category: '外部技能'
  decision-mapping:
    source: mattpocock
    category: '外部技能'
