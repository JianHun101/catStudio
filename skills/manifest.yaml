# CatStudy 技能路由清单
# 定义 catStudy 自定义技能的分类、触发条件、输出和衔接关系
#
# 来源标记（source，三方一致校验强制）：
#   self       — 猫咖自研（本项目维护）
#   mattpocock — 来自 mattpocock/skills 系（特征：disable-model-invocation 字段）
#   external   — 其他第三方来源（无版本溯源，需登记 provenance）
# 判定口径说明：disable-model-invocation 是 mattpocock 技能集的标志性 frontmatter；
# 无该字段的第三方技能统一标 external（来源待核，列入 .sync-provenance.json 追踪）。

skills:
  # ── 自研（猫咖定制，参与审查流程链）──
  on-site-project:
    source: self
    use_when: |
      被派到外部/第三方项目做改动（非本仓库）、接手陌生技术栈、需跨长会话持续可信排障、改动会覆盖用户真实数据。
    not_for: |
      本仓库内的常规开发（用 implement）、纯讨论、已知原因的简单修复。
    category: '驻场方法论'
    description: |
      驻场外部项目全流程方法论：先了解（目标/影响面/相关模块/术语表/文件位置）
      → 先确认版本控制再备份（有VCS走分支/无VCS手动备份）→ 工作隔离+临时文件放置
      → 过程文档（现状/已确认事实链/教训）→ 单变量隔离 → 实测验证。
    triggers:
      - '驻场'
      - '外部项目'
      - '接手项目'
      - '陌生代码库'
    output: '清晰项目认知 + 持续可信过程文档 + 可回退改动'
    next: 'break-tunnel-vision'
    refs:
      - 'break-tunnel-vision'
      - 'diagnosing-bugs'
      - 'session-summary'
      - 'handoff'

  break-tunnel-vision:
    source: self
    use_when: |
      同一个方向反复修复失败（2+ 次）、每次修完还是同样的错、钻在某个自认为的原因里出不来、用户说"你的思路错了/想想别的方向"。
    not_for: |
      第一次修复就成功的常见 bug（用 diagnosing-bugs）。
    category: '排障方法论'
    description: |
      跳出牛角尖方法论：停止 → 回头看问题发生的时机/位置 → 从浅到深（先证表层）→
      前后关系（改动引入的变量）→ 关键卡点 → 找"动它结果就翻转"的关键点。
    triggers:
      - '钻牛角尖'
      - '反复失败'
      - '还是崩'
      - '换个方向'
      - '思路错了'
    output: '重新锚定——停止 + 新方向 + 一个具体可测的隔离/修复方案'
    prev: 'on-site-project'
    refs:
      - 'on-site-project'
      - 'diagnosing-bugs'

  quality-gate:
    source: self
    use_when: |
      a code change is finished and needs a self-check before review.
    not_for: |
      pure conversation without code changes, exploration, or when already inside the review loop.
    category: '审查流程'
    description: |
      代码变更提交审查前的自查门。
      检查编码规范、测试覆盖、架构边界、安全性和未完成项。
    triggers:
      - '自查'
      - 'quality gate'
      - '提交前检查'
      - '检查一下代码'
    output: 'Quality Gate Report（通过/未通过 + 逐项结果）'
    next: 'request-review'
    refs:
      - 'CODING_STANDARDS.md'
      - 'refs/review-standards.md'

  request-review:
    source: self
    use_when: |
      work is complete and verified, quality-gate passed, and a review is needed.
    not_for: |
      reviewing code yourself (use review), receiving feedback (use receive-review), or requesting before quality-gate passes.
    category: '审查流程'
    description: |
      打包完成的工作并发送审查请求。
      按照审查配对规则选择审查者，使用标准模板格式。
    triggers:
      - '发起审查'
      - 'request review'
      - '让人看看'
      - 'review 一下'
    output: '审查请求文档（按模板格式 + @审查者）'
    next: 'receive-review'
    refs:
      - 'refs/review-request-template.md'
      - 'refs/shared-rules.md'
    preconditions:
      - 'quality-gate PASS'
      - 'pnpm test 全过'
      - 'pnpm lint 无新增错误'

  receive-review:
    source: self
    use_when: |
      another agent's review feedback arrives after a /request-review.
    not_for: |
      review conclusions that are mergeable (nothing to fix), or when you are the reviewer.
    category: '审查流程'
    description: |
      接收并处理审查反馈。
      逐项核实审查发现，按 P1/P2/P3 分类处理，拒绝表演性同意。
    triggers:
      - '处理审查'
      - 'receive review'
      - '审查反馈'
      - '@审查者 的审查结果'
    output: '修复确认表（逐项状态 + 测试结果）'
    next: 'request-review (如需重新审查)'
    refs:
      - 'refs/review-standards.md'
      - 'refs/shared-rules.md'

  session-summary:
    source: mattpocock
    use_when: |
      the session's work is finished and the user wants a summary document.
    not_for: |
      handing work to another agent across sessions (use handoff), or a recap without the strict five-section format.
    category: '文档'
    description: |
      已有技能（来自 mattpocock/skills）。
      生成 CatStudy 格式的结构化会议总结。
    triggers:
      - '总结'
      - 'session summary'
      - '会议总结'
    output: 'docs/sessions/cat-study-{slug}-summary.md'

  vision-assist:
    source: self
    use_when: |
      the task requires SEEING an image — the user attaches an image and asks what it shows, asks to describe a picture, wants visual review of a UI screenshot, or needs image-link functionality verified. Your own model cannot render images natively (Read returns "[Unsupported Image]"), so route any image-seeing task through this pipeline instead of trying to read pixels yourself.
    not_for: |
      text-only questions where no pixel content exists.
    category: '视觉'
    requires_mcp: 'ollama:qwen3.5:9b (127.0.0.1:11434)'
    description: |
      自研技能：用项目 qwen3.5:9b（Ollama）视觉管线当眼睛。
      模型无法原生看图时路由到本技能。
    triggers:
      - '看图'
      - 'vision'
      - '截图'
    output: '图片内容描述'

  # ── mattpocock 系（disable-model-invocation 特征）──
  ask-matt:
    source: mattpocock
    use_when: |
      you are unsure which skill or flow applies to the current request, or want a guided path through the available skills.
    not_for: |
      executing a specific skill directly.
    category: '外部技能'
  decision-mapping:
    source: mattpocock
    use_when: |
      the idea is too fuzzy to build directly and questions need runnable answers.
    not_for: |
      ideas already concrete enough to implement.
    category: '外部技能'
  edit-article:
    source: mattpocock
    use_when: |
      user wants to edit, revise, or improve an article draft.
    not_for: |
      shaping raw material into an article from scratch (use writing-shape), or writing new sections without a draft.
    category: '外部技能'
  grill-me:
    source: mattpocock
    use_when: |
      the user has a rough plan and wants it stress-tested through questioning, without creating docs.
    not_for: |
      interviews that should also record ADRs and glossary (use grill-with-docs).
    category: '外部技能'
  grill-with-docs:
    source: mattpocock
    use_when: |
      the user has a codebase and wants the interview's conclusions persisted.
    not_for: |
      quick interviews with no doc output (use grill-me).
    category: '外部技能'
  handoff:
    source: mattpocock
    use_when: |
      work crosses sessions, another agent needs your context, or you are handing a task to a fresh session.
    not_for: |
      sending a review request for finished work (use request-review), or for project-internal summaries (use session-summary).
    category: '外部技能'
  implement:
    source: mattpocock
    use_when: |
      the requirements are settled and the work is ready to build, ideally with a PRD and one issue in a fresh session.
    not_for: |
      fuzzy ideas that still need investigation (use decision-mapping) or prototype exploration (use prototype).
    category: '外部技能'
  improve-codebase-architecture:
    source: mattpocock
    use_when: |
      the user wants to improve architecture, find deep-module candidates, or review design debt.
    not_for: |
      designing one specific module's interface (use design-an-interface).
    category: '外部技能'
  loop-me:
    source: mattpocock
    use_when: |
      the user wants to iterate on workflow or automation specs in this workspace until the definition of done is clear.
    not_for: |
      general plan interviews outside this workspace.
    category: '外部技能'
  prototype:
    source: mattpocock
    use_when: |
      a question needs a runnable answer before committing to a design.
    not_for: |
      production work — prototypes are throwaway by design (use implement).
    category: '外部技能'
  setup-matt-pocock-skills:
    source: mattpocock
    use_when: |
      the engineering skills are installed and this repo is not yet configured for them.
    not_for: |
      a per-feature setup, or repos that already have an issue tracker configured.
    category: '外部技能'
  teach:
    source: mattpocock
    use_when: |
      the user wants to learn something and practice it in this workspace.
    not_for: |
      answering a one-off question without a lesson structure.
    category: '外部技能'
  to-issues:
    source: mattpocock
    use_when: |
      a PRD is settled and the work needs to be split for parallel execution.
    not_for: |
      planning refactors (use request-refactor-plan), or writing the PRD itself (use to-prd).
    category: '外部技能'
  to-prd:
    source: mattpocock
    use_when: |
      a design conversation has reached enough clarity to write down.
    not_for: |
      ideas still fuzzy (use decision-mapping or grilling first), or splitting into issues (use to-issues).
    category: '外部技能'
  triage:
    source: mattpocock
    use_when: |
      issues or PRs need routing, verification, or agent-ready briefs.
    not_for: |
      conversationally filing new bugs (use qa), or skipping the triage state machine.
    category: '外部技能'
  ubiquitous-language:
    source: mattpocock
    use_when: |
      user wants to define domain terms, build a glossary, harden terminology, create a ubiquitous language, or mentions "domain model" or "DDD".
    not_for: |
      maintaining the project's domain model (use domain-modeling).
    category: '外部技能'
  writing-beats:
    source: mattpocock
    use_when: |
      raw material exists and needs structuring into a narrative journey.
    not_for: |
      raw mining with no structure yet (use writing-fragments), or shaping into final prose (use writing-shape).
    category: '外部技能'
  writing-fragments:
    source: mattpocock
    use_when: |
      ideas are scattered and need capturing before any structure.
    not_for: |
      structuring existing material (use writing-beats), or editing a draft (use edit-article).
    category: '外部技能'
  writing-great-skills:
    source: mattpocock
    use_when: |
      writing or editing a SKILL.md and want to apply proven skill-design principles.
    not_for: |
      invoking other skills, or one-off style advice without a skill to write.
    category: '外部技能'
  writing-shape:
    source: mattpocock
    use_when: |
      beats are settled and the article needs final prose.
    not_for: |
      assembling beats from fragments (use writing-beats), or editing an existing draft (use edit-article).
    category: '外部技能'

  # ── 其他第三方（无来源特征，列入 provenance 追踪）──
  codebase-design:
    source: external
    use_when: |
      the user wants to design or improve a module's interface, find deepening opportunities, decide where a seam goes, make code more testable or AI-navigable, or when another skill needs the deep-module vocabulary.
    not_for: |
      implementing code or reviewing a finished diff.
    category: '外部技能'
  design-an-interface:
    source: external
    use_when: |
      user wants to design an API, explore interface options, compare module shapes, or mentions "design it twice".
    not_for: |
      settling on a single design up front, or designing without requirements.
    category: '外部技能'
  diagnosing-bugs:
    source: external
    use_when: |
      the user says "diagnose"/"debug this", or reports something broken/throwing/failing/slow.
    not_for: |
      trivial bugs fixable in one pass without a feedback loop.
    category: '外部技能'
  domain-modeling:
    source: external
    use_when: |
      the user wants to pin down domain terminology or a ubiquitous language, record an architectural decision, or when another skill needs to maintain the domain model.
    not_for: |
      extracting a one-off glossary without touching the model.
    category: '外部技能'
  git-guardrails-claude-code:
    source: external
    use_when: |
      user wants to prevent destructive git operations, add git safety hooks, or block git push/reset in Claude Code.
    not_for: |
      general pre-commit formatting hooks (use setup-pre-commit).
    category: '外部技能'
  grilling:
    source: external
    use_when: |
      the user wants to stress-test a plan before building, or uses any 'grill' trigger phrases.
    not_for: |
      plans already settled, or interviews that must also produce docs (use grill-with-docs).
    category: '外部技能'
  migrate-to-shoehorn:
    source: external
    use_when: |
      user mentions shoehorn, wants to replace `as` in tests, or needs partial test data.
    not_for: |
      production code assertions, or test code already using fromPartial/fromAny.
    category: '外部技能'
  obsidian-vault:
    source: external
    use_when: |
      user wants to find, create, or organize notes in Obsidian.
    not_for: |
      note-taking outside the vault, or general file management.
    category: '外部技能'
  qa:
    source: external
    use_when: |
      user wants to report bugs, do QA, file issues conversationally, or mentions "QA session".
    not_for: |
      triaging already-filed issues (use triage), or bug diagnosis (use diagnosing-bugs).
    category: '外部技能'
  request-refactor-plan:
    source: external
    use_when: |
      user wants to plan a refactor, create a refactoring RFC, or break a refactor into safe incremental steps.
    not_for: |
      implementing the refactor itself (use implement), or one-shot rewrites.
    category: '外部技能'
  resolving-merge-conflicts:
    source: external
    use_when: |
      you need to resolve an in-progress git merge/rebase conflict.
    not_for: |
      preventing destructive git operations (use git-guardrails-claude-code), or general git questions.
    category: '外部技能'
  review:
    source: external
    use_when: |
      the user wants to review a branch, a PR, work-in-progress changes, or asks to "review since X".
    not_for: |
      sending your own work for review (use request-review), or reviewing without a fixed point.
    category: '外部技能'
  scaffold-exercises:
    source: external
    use_when: |
      user wants to scaffold exercises, create exercise stubs, or set up a new course section.
    not_for: |
      writing course content beyond the scaffold.
    category: '外部技能'
  setup-pre-commit:
    source: external
    use_when: |
      user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing.
    not_for: |
      blocking dangerous git commands (use git-guardrails-claude-code).
    category: '外部技能'
  tdd:
    source: external
    use_when: |
      the user wants to build features or fix bugs test-first, mentions "red-green-refactor", or wants integration tests.
    not_for: |
      debugging existing failures (use diagnosing-bugs), or adding tests after the fact.
    category: '外部技能'

# ── 项目定制层（catstudy/，随迁保留，一期不切路由）──
# 4 个 catstudy-* 定制 skill 与顶级同名 skill 是两套不同定义：
# 当前 manifest 路由顶级通用版；定制版转正评估列二期。
# catstudy/ 内部条目不参与顶级计数（40/40），由 check-manifest 单独校验前缀。
catstudy:
  # merged_from：合并来源登记（catstudy 定制层随迁保留，转正评估列二期）
  catstudy-quality-gate:
    source: self
    merged_from: 'quality-gate（顶级通用版 + 猫咖定制）'
  catstudy-handoff:
    source: self
    merged_from: 'handoff（顶级 mattpocock 版 + 猫咖定制）'
  catstudy-request-review:
    source: self
    merged_from: 'request-review（顶级通用版 + 猫咖定制）'
  catstudy-receive-review:
    source: self
    merged_from: 'receive-review（顶级通用版 + 猫咖定制）'

# 审查流程链
# quality-gate → request-review → receive-review → (loop until ✅)
pipeline:
  review:
    - quality-gate
    - request-review
    - receive-review

# 三条铁律
iron_laws:
  - '审查自动化：post-commit hook 触发 handoff-gen，Agent 只补填不自行发起'
  - '禁止冒充：每只猫有固定身份和角色'
  - '依赖声明优先：安装任何包前必须声明并获得审查者批准'
