# CatStudy 技能路由清单
# 定义 catStudy 自定义技能的分类、触发条件、输出和衔接关系
#
# 来源标记（source，三方一致校验强制）：
#   self       — 猫咖自研（本项目维护）
#   mattpocock — 来自 mattpocock/skills 系（v1.1 主线按来源仓库登记）
#   external   — 其他第三方来源（无版本溯源，需登记 provenance）
# 判定口径说明：disable-model-invocation 是 mattpocock 技能集的标志性 frontmatter；
# v1.1 主线 skill（to-spec/to-tickets/wayfinder/code-review）按来源仓库标 mattpocock——
# code-review 无 disable-model-invocation 字段仍标 mattpocock（店长裁决，追平 v1.1）；
# session-summary 已转自研维护（不在 v1.1 树），归 self；
# 其余无该字段的第三方技能统一标 external（来源待核——provenance 真相源是 skills-lock.json
# 的 source/skillPath/computedHash；新增准入无自动拦截，靠审查人比对 lock 条目）。
#
# 两层机制（勿混）：
#   · MCP read_skill 白名单（scripts/mcp-server-utils.mjs 的 SKILL_CATALOG）= 猫可自取范围，是访问约束；
#   · disable-model-invocation = 上游来源标记（mattpocock 技能集的标志性 frontmatter），本仓库不构成访问约束。
#   白名单 ≠ 猫咖流程权威：流程权威在 seed 角色 prompt 与 CONTEXT.md，本清单只决定「能取哪些技能正文」。

skills:
  # ── 自研（猫咖定制，参与审查流程链）──
  on-site-project:
    source: self
    use_when: |
      被派到外部/第三方项目做改动（非本仓库）、接手陌生技术栈、需跨长会话持续可信排障、改动会覆盖用户真实数据。
    not_for: |
      本仓库内的常规开发（用 implement）、纯讨论、已知原因的简单修复。
    category: '驻场方法论'
    description: |
      驻场外部项目全流程方法论：先了解（目标/影响面/相关模块/术语表/文件位置）
      → 先确认版本控制再备份（有VCS走分支/无VCS手动备份）→ 工作隔离+驻场工作区（集中+持久）
      → 过程文档（现状/已确认事实链/教训）→ 单变量隔离 → 实测验证。
    triggers:
      - '驻场'
      - '外部项目'
      - '接手项目'
      - '陌生代码库'
    output: '清晰项目认知 + 持续可信过程文档 + 可回退改动'
    next: 'break-tunnel-vision'
    refs:
      - 'break-tunnel-vision'
      - 'diagnosing-bugs'
      - 'session-summary'
      - 'session-handoff'

  break-tunnel-vision:
    source: self
    use_when: |
      同一个方向反复修复失败（2+ 次）、每次修完还是同样的错、钻在某个自认为的原因里出不来、用户说"你的思路错了/想想别的方向"。
    not_for: |
      第一次修复就成功的常见 bug（用 diagnosing-bugs）。
    category: '排障方法论'
    description: |
      跳出牛角尖方法论：停止 → 回头看问题发生的时机/位置 → 从浅到深（先证表层）→
      前后关系（改动引入的变量）→ 关键卡点 → 找"动它结果就翻转"的关键点。
    triggers:
      - '钻牛角尖'
      - '反复失败'
      - '还是崩'
      - '换个方向'
      - '思路错了'
    output: '重新锚定——停止 + 新方向 + 一个具体可测的隔离/修复方案'
    prev: 'on-site-project'
    refs:
      - 'on-site-project'
      - 'diagnosing-bugs'

  spec-gate:
    source: self
    use_when: |
      requirements or a spec is ready and needs a falsifiability + contract-lock check before tickets are cut or code is built.
    not_for: |
      code that is already being implemented or reviewed (use quality-gate), or fuzzy ideas that still need grilling (use grilling/to-spec).
    category: '需求流程'
    description: |
      需求/规格进入实施前的自查门（前半个门，对称后端 quality-gate）。
      检查需求可证伪性、验收信号、边界/契约/验收是否钉死，通过后才能拆票/实施。
    triggers:
      - 'spec gate'
      - '需求自查'
      - '规格检查'
      - '开工前检查'
    output: 'Gate Report（PASS/FAIL + Gate A/B/C 逐项结果）'
    prev: 'grilling/to-spec'
    next: 'to-tickets/implement'
    refs:
      - 'quality-gate'
      - 'implement'
      - 'to-spec'
      - 'to-tickets'
    preconditions:
      - 'spec 或需求文档已成型（grilling/to-spec 产物）'

  quality-gate:
    source: self
    use_when: |
      a code change is finished and needs a self-check before review.
    not_for: |
      pure conversation without code changes, exploration, or when already inside the review loop.
    category: '审查流程'
    description: |
      代码变更提交审查前的自查门。
      检查编码规范、测试覆盖、架构边界、安全性和未完成项。
    triggers:
      - '自查'
      - 'quality gate'
      - '提交前检查'
      - '检查一下代码'
    output: 'Quality Gate Report（通过/未通过 + 逐项结果）'
    next: 'review（作者按 request-review 发起，审查者承担）'
    refs:
      - 'CODING_STANDARDS.md'
      - 'refs/review-standards.md'

  request-review:
    source: self
    use_when: |
      a code change has passed self-check and you are about to request review.
    not_for: |
      writing the review conclusion, or when you are the reviewer.
    category: '审查流程'
    description: |
      发起审查请求前的前置门槛与轮次规则。
      六条 BLOCKED 门槛不满足则请求发不出去；同型 finding 二犯触发 failure-mode audit；
      同对象 ≥3 轮停手升级到需求/方案层。
    triggers:
      - '发起审查'
      - '请求审查'
      - 'request review'
      - '提交审查'
    output: '可投递的审查请求（模板 + 自检证据）或 BLOCKED 清单'
    next: 'receive-review'
    refs:
      - 'refs/review-request-template.md'

  receive-review:
    source: self
    use_when: |
      another agent's review feedback arrives after a code review.
    not_for: |
      review conclusions that are mergeable (nothing to fix), or when you are the reviewer.
    category: '审查流程'
    description: |
      接收并处理审查反馈。
      逐项核实审查发现，按 P1/P2/P3 分类处理，拒绝表演性同意。
    triggers:
      - '处理审查'
      - 'receive review'
      - '审查反馈'
      - '@审查者 的审查结果'
    output: '修复确认表（逐项状态 + 测试结果）'
    next: 'implement (❌打回重做)'
    refs:
      - 'refs/review-standards.md'

  session-summary:
    source: self
    use_when: |
      the session's work is finished and the user wants a summary document.
    not_for: |
      handing work to another agent across sessions (use session-handoff), or a recap without the strict five-section format.
    category: '文档'
    description: |
      自研技能：生成 CatStudy 格式的结构化会议总结
      （What/Why/Tradeoff/Open Questions/Next Action 五段式，docs/sessions/ 留档）。
    triggers:
      - '总结'
      - 'session summary'
      - '会议总结'
    output: 'docs/sessions/cat-study-{slug}-summary.md'

  # ── mattpocock 系（来源仓库 mattpocock/skills，v1.1 主线）──
  code-review:
    source: mattpocock
    category: '外部技能'
  grill-me:
    source: mattpocock
    use_when: |
      the user has a rough plan and wants it stress-tested through questioning, without creating docs.
    not_for: |
      interviews that should also record ADRs and glossary (use grill-with-docs).
    category: '外部技能'
  grill-with-docs:
    source: mattpocock
    use_when: |
      the user has a codebase and wants the interview's conclusions persisted.
    not_for: |
      quick interviews with no doc output (use grill-me).
    category: '外部技能'
  session-handoff:
    source: mattpocock
    use_when: |
      work crosses sessions, another agent needs your context, or you are handing a task to a fresh session.
    not_for: |
      sending a review request for finished work (the author sends that via request-review), or for project-internal summaries (use session-summary).
    category: '外部技能'
  implement:
    source: mattpocock
    use_when: |
      the requirements are settled and the work is ready to build, ideally with a spec and one ticket in a fresh session.
    not_for: |
      fuzzy ideas that still need investigation (use wayfinder) or prototype exploration (use prototype).
    category: '外部技能'
    preconditions:
      - 'spec + 工单在场（grilling/to-spec → to-tickets 产物；跳 grilling 须 spec 尾部决策留痕）'
      - 'spec-gate PASS（每条需求可证伪、验收信号明确）'
  improve-codebase-architecture:
    source: mattpocock
    use_when: |
      the user wants to improve architecture, find deep-module candidates, or review design debt.
    not_for: |
      designing one specific module's interface (use codebase-design).
    category: '外部技能'
  prototype:
    source: mattpocock
    use_when: |
      a question needs a runnable answer before committing to a design.
    not_for: |
      production work — prototypes are throwaway by design (use implement).
    category: '外部技能'
  to-spec:
    source: mattpocock
    category: '外部技能'
  to-tickets:
    source: mattpocock
    category: '外部技能'
  triage:
    source: mattpocock
    use_when: |
      issues or PRs need routing, verification, or agent-ready briefs.
    not_for: |
      conversationally filing new bugs, or skipping the triage state machine.
    category: '外部技能'
  wayfinder:
    source: mattpocock
    category: '外部技能'
  writing-for-agents:
    source: mattpocock
    use_when: |
      creating or editing a skill, or modifying AGENTS.md or CLAUDE.md.
    not_for: |
      writing human-facing prose (READMEs, articles, release notes) or invoking other skills.
    category: '外部技能'

  # ── 其他第三方（无来源特征，列入 provenance 追踪）──
  codebase-design:
    source: external
    use_when: |
      the user wants to design or improve a module's interface, find deepening opportunities, decide where a seam goes, make code more testable or AI-navigable, or when another skill needs the deep-module vocabulary.
    not_for: |
      implementing code or reviewing a finished diff.
    category: '外部技能'
  # 来源 Leonxlnx/taste-skill（外部设计品味判据，不属 mattpocock 系；provenance 见 skills-lock.json）
  design-taste-frontend:
    source: external
    category: '外部技能'
  diagnosing-bugs:
    source: external
    use_when: |
      the user says "diagnose"/"debug this", or reports something broken/throwing/failing/slow.
    not_for: |
      trivial bugs fixable in one pass without a feedback loop.
    category: '外部技能'
  domain-modeling:
    source: external
    use_when: |
      the user wants to pin down domain terminology or a ubiquitous language, record an architectural decision, or when another skill needs to maintain the domain model.
    not_for: |
      extracting a one-off glossary without touching the model.
    category: '外部技能'
  git-guardrails-claude-code:
    source: external
    use_when: |
      user wants to prevent destructive git operations, add git safety hooks, or block git push/reset in Claude Code.
    not_for: |
      general pre-commit formatting hooks (use setup-pre-commit).
    category: '外部技能'
  grilling:
    source: external
    use_when: |
      the user wants to stress-test a plan before building, or uses any 'grill' trigger phrases.
    not_for: |
      plans already settled, or interviews that must also produce docs (use grill-with-docs).
    category: '外部技能'
  resolving-merge-conflicts:
    source: external
    use_when: |
      you need to resolve an in-progress git merge/rebase conflict.
    not_for: |
      preventing destructive git operations (use git-guardrails-claude-code), or general git questions.
    category: '外部技能'
  setup-pre-commit:
    source: external
    use_when: |
      user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing.
    not_for: |
      blocking dangerous git commands (use git-guardrails-claude-code).
    category: '外部技能'
  tdd:
    source: external
    use_when: |
      the user wants to build features or fix bugs test-first, mentions "red-green-refactor", or wants integration tests.
    not_for: |
      debugging existing failures (use diagnosing-bugs), or adding tests after the fact.
    category: '外部技能'
  # 来源 cursor/plugins（pstack/skills/unslop，frontmatter 逐字一致；非 mattpocock 系——
  # disable-model-invocation 是标志性字段但来源仓库判定优先）。正文为中文翻译（非逐字
  # vendor，不锁字节一致性，故不进 .prettierignore）；provenance 见 skills-lock.json。
  unslop:
    source: external
    category: '外部技能'

# ── 项目定制层（catstudy/，随迁保留，一期不切路由）──
# 2 个 catstudy-* 定制 skill 与顶级同名 skill 是两套不同定义：
# 当前 manifest 路由顶级通用版；定制版转正评估列二期。
# catstudy/ 内部条目不参与顶级计数（28/28），由 check-manifest 单独校验前缀。
# 投递型定制层（handoff）已按 ADR-0014 §3 移除——投递外移后其存在理由消亡，内容并入基础技能。
# request-review 于 2026-09-10 回流为顶级技能（ADR-0014 §5 修订）：hook 不再机械投递，改由作者自行发起。
catstudy:
  # merged_from：合并来源登记（catstudy 定制层随迁保留，转正评估列二期）
  catstudy-quality-gate:
    source: self
    merged_from: 'quality-gate（顶级通用版 + 猫咖定制）'
  catstudy-receive-review:
    source: self
    merged_from: 'receive-review（顶级通用版 + 猫咖定制）'

# 开发流程链（前端 gate 半门，骑在现有前端 skill 上）
# 大块工作 wayfinder 起图 → grilling/to-spec 出 spec → spec-gate 前门放行 → to-tickets 拆票 → implement → quality-gate（进 review 链）
# spec-gate 是需求→实施之间的机械门：需求可证伪 + 契约钉死才放行；前段 skill 靠 use_when 衔接
# 审查流程链（后半个门）
# quality-gate → （作者按 request-review 发起审查）→ receive-review → (loop until ✅)
# 审查请求由作者自行发起（ADR-0014 §5 修订）；post-commit hook 仅在提交无归属执行时兜底投递。
pipeline:
  dev:
    - spec-gate
  review:
    - quality-gate
    - request-review
    - receive-review

# 三条铁律
iron_laws:
  - '审查发起：Agent 自查后自行发起审查请求（request-review）；post-commit hook 仅在提交无归属执行时兜底'
  - '禁止冒充：每只猫有固定身份和角色'
  - '依赖声明优先：安装任何包前必须声明并获得审查者批准'
