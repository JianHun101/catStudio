# ── 项目定制层（catstudy/，随迁保留，一期不切路由）──
# 4 个 catstudy-* 定制 skill 与顶级同名 skill 是两套不同定义：
# 当前 manifest 路由顶级通用版；定制版转正评估列二期。
# catstudy/ 内部条目不参与顶级计数（40/40），由 check-manifest 单独校验前缀。
catstudy:
  # merged_from：合并来源登记（catstudy 定制层随迁保留，转正评估列二期）
  catstudy-quality-gate:
    source: self
    merged_from: 'quality-gate（顶级通用版 + 猫咖定制）'
  catstudy-handoff:
    source: self
    merged_from: 'handoff（顶级 mattpocock 版 + 猫咖定制）'
  catstudy-request-review:
    source: self
    merged_from: 'request-review（顶级通用版 + 猫咖定制）'
  catstudy-receive-review:
    source: self
    merged_from: 'receive-review（顶级通用版 + 猫咖定制）'

# 审查流程链
# quality-gate → request-review → receive-review → (loop until ✅)
pipeline:
  review:
    - quality-gate
    - request-review
    - receive-review

# 三条铁律
iron_laws:
  - '审查自动化：post-commit hook 触发 handoff-gen，Agent 只补填不自行发起'
  - '禁止冒充：每只猫有固定身份和角色'
  - '依赖声明优先：安装任何包前必须声明并获得审查者批准'
