<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CatStudy — 猫咖风格的多Agent AI对话平台，多只猫咪角色协作完成任务"
    />
    <meta name="theme-color" content="#1b1815" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>"
    />
    <title>CatStudy — 猫咖多Agent对话</title>
    <style>
      /* ═══════════════════════════════════════════════
       CatStudy Design Tokens — Warm Cat Cafe Theme
       ═══════════════════════════════════════════════ */

      :root {
        /* Surfaces — 从深到浅的四层 */
        --bg-deep: #14110e; /* 最深底 — 聊天主区 */
        --bg-base: #1b1815; /* 基础 — 侧边栏 */
        --bg-surface: #231f1b; /* 表面 — 卡片/气泡 */
        --bg-hover: #2c2722; /* 悬停 */
        --bg-raised: #312b25; /* 浮起 — 弹窗背景 */

        /* Borders */
        --border-subtle: #292420; /* 隐式分隔 */
        --border-default: #3a332c; /* 卡片边框 */
        --border-table: #5c4a3b; /* 表格边框 — 暖棕色，在深色背景上清晰可见 */
        --border-focus: #b08968; /* 聚焦 / 强调边框 */

        /* Text */
        --text-primary: #e6ddd0; /* 主文字 — 暖白 */
        --text-secondary: #a0988e; /* 副文字 */
        --text-muted: #6b655c; /* 占位符/禁用 */

        /* Accent — 暖焦糖色系 */
        --accent: #d4a574; /* 主强调色 */
        --accent-soft: rgba(212, 165, 116, 0.15); /* 背景强调 */
        --accent-glow: rgba(212, 165, 116, 0.25); /* focus 光晕 — 由 accent 派生 */
        --accent-tint: rgba(212, 165, 116, 0.06); /* 最淡强调 — 提示框背景 */
        --accent-msg-bg: rgba(212, 165, 116, 0.08); /* 浅强调 — 用户消息气泡背景 */
        --accent-msg-border: rgba(212, 165, 116, 0.15); /* 浅强调 — 用户消息气泡边框 */
        --accent-row-hover: rgba(212, 165, 116, 0.12); /* 悬停强调 — 表格行背景 */
        --accent-hint-border: rgba(212, 165, 116, 0.12); /* 强调边框 — 提示框 */
        --accent-hover: #e0b98c; /* 悬停 */
        --accent-pink: #d4849a; /* 次强调 — 柔和玫瑰 */
        --accent-red: #e0556a; /* 危险操作 */
        --accent-green: #7eb899; /* 成功/空闲 */
        --accent-yellow: #d4a854; /* 忙碌/警告 */

        /* Status */
        --status-idle: #5c5852;
        --status-busy: #d4a854;

        /* Sizing */
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --radius-xl: 18px;

        /* Typography */
        --font-sans:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
        --font-mono: 'JetBrains Mono', 'Consolas', 'Cascadia Code', monospace;

        /* Shadows */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);

        /* Transitions */
        --ease-out: 0.15s ease-out;
        --ease-in: 0.12s ease-in;

        /* Syntax highlight (dark) — Catppuccin Mocha palette */
        --syntax-bg: #1a1714;
        --syntax-text: #cdd6f4;
        --syntax-keyword: #cba6f7;
        --syntax-string: #a6e3a1;
        --syntax-number: #fab387;
        --syntax-comment: #6c7086;
        --syntax-function: #89b4fa;
        --syntax-type: #f9e2af;
        --syntax-attr: #89dceb;
        --syntax-builtin: #f38ba8;
        --syntax-params: #f2cdcd;
        --syntax-punctuation: #bac2de;
      }

      /* ═══════════════════════════════════════════════
       Light Theme — warm cream tones, same cafe identity
       ═══════════════════════════════════════════════ */

      [data-theme='light'] {
        /* Surfaces — warm cream/beige stack */
        --bg-deep: #f8f4ed;
        --bg-base: #efe8dd;
        --bg-surface: #ffffff;
        --bg-hover: #e8dfd2;
        --bg-raised: #f5efe5;

        /* Borders */
        --border-subtle: #e0d6c7;
        --border-default: #d4c8b2;
        --border-table: #c4b69c;
        --border-focus: #b08968;

        /* Text */
        --text-primary: #3c3028;
        --text-secondary: #6b5c4a;
        --text-muted: #a09080;

        /* Accent — slightly deepened for legibility on light bg */
        --accent: #c89060;
        --accent-soft: rgba(180, 130, 80, 0.12);
        --accent-glow: rgba(200, 144, 96, 0.25); /* focus 光晕 — 对应用亮色 accent #c89060 */
        --accent-tint: rgba(
          180,
          130,
          80,
          0.06
        ); /* 最淡强调 — 提示框背景（沿用 --accent-soft 亮色加深 RGB 先例） */
        --accent-msg-bg: rgba(180, 130, 80, 0.08); /* 浅强调 — 用户消息气泡背景 */
        --accent-msg-border: rgba(180, 130, 80, 0.15); /* 浅强调 — 用户消息气泡边框 */
        --accent-row-hover: rgba(180, 130, 80, 0.12); /* 悬停强调 — 表格行背景 */
        --accent-hint-border: rgba(180, 130, 80, 0.12); /* 强调边框 — 提示框 */
        --accent-hover: #b07840;
        --accent-pink: #c47088;
        --accent-red: #d04458;
        --accent-green: #5a8f6e;
        --accent-yellow: #c89840;

        /* Status */
        --status-idle: #9a9080;
        --status-busy: #c89840;

        /* Shadows — much softer on light surfaces */
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);

        /* Syntax highlight (light) */
        --syntax-bg: #f4efe6;
        --syntax-text: #4a3f35;
        --syntax-keyword: #8b5c9e;
        --syntax-string: #4a8b5c;
        --syntax-number: #c07040;
        --syntax-comment: #a09888;
        --syntax-function: #5c7db8;
        --syntax-type: #c89840;
        --syntax-attr: #3d8a8a;
        --syntax-builtin: #c47088;
        --syntax-params: #6b5c4a;
        --syntax-punctuation: #8a7d6e;
      }

      /* ═══════════════════════════════════════════════
       Global Reset
       ═══════════════════════════════════════════════ */

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        color: var(--text-primary);
        background: var(--bg-deep);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #app {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* ═══════════════════════════════════════════════
       Scrollbar — Plan D: border technique + Firefox

       WebKit: constant 10px track, ~4px visual thumb
       (10px - 3px*2 border), expands to 10px on hover.
       Firefox: thin (~8px) with theme-matching color.
       ═══════════════════════════════════════════════ */

      /* Firefox — scrollbar-width is NOT inherited, must be on
         the actual scrolling element. scrollbar-color IS
         inherited, so it stays on html as a global default. */
      .chat-messages-wrapper,
      .session-items,
      .agent-cards,
      .collapsed-sessions,
      .collapsed-agents,
      .modal,
      .panel-inner,
      .mention-dropdown {
        scrollbar-width: thin;
        scrollbar-color: var(--border-table) transparent;
      }

      /* WebKit */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-table);
        border: 3px solid transparent;
        background-clip: content-box;
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
        border-width: 1px;
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* ═══════════════════════════════════════════════
       Selection
       ═══════════════════════════════════════════════ */

      ::selection {
        background: var(--accent-soft);
        color: var(--accent-hover);
      }

      /* ═══════════════════════════════════════════════
       Focus visible (accessibility)
       ═══════════════════════════════════════════════ */

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 2px;
      }

      /* 隐藏鼠标点击时的 focus 环，仅键盘导航时显示 */
      :focus:not(:focus-visible) {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
